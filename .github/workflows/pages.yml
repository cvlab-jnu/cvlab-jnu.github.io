# Publish a fully static snapshot of the public site to GitHub Pages.
#
# HOW THIS DIFFERS FROM SERVING docs/ DIRECTLY
# --------------------------------------------
# docs/ is a shell that fetches GET /api/content when a visitor opens it. Put
# that on Pages and every visit still depends on the API host being awake.
#
# This workflow instead runs scripts/snapshot.js, which asks the API once, here,
# downloads every photograph and document, rewrites the references to local
# copies, and publishes the result. The published site then makes no requests to
# the API at all: nothing to wake, nothing to keep awake, no cold start, free
# for ever, served from GitHub's CDN.
#
# The trade is that the site shows what the database held when this last ran.
# Edit in /admin on the API host, then run this again.
#
# SETUP, ONCE
#   1. Settings → Pages → Source → "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → Variables → New variable
#        Name:  CVLAB_API_BASE
#        Value: https://cvlab-jnu.onrender.com       (no trailing slash)
#
# No secret is needed. The snapshot reads only the public, unauthenticated
# /api/content endpoint and the public media routes — this workflow never holds
# a database credential or a session.
#
# SITE_ORIGIN does NOT need setting on the API host for this. The published
# pages never call it, so there is no cross-origin read to permit.

name: Publish static site to Pages

on:
  workflow_dispatch:

  # A weekly rebuild picks up anything edited in /admin without you having to
  # remember, and the request that wakes the API also stops Atlas treating the
  # cluster as idle. Delete this block if you would rather publish only by hand.
  schedule:
    - cron: '41 2 * * 0'      # Sundays, 02:41 UTC (08:11 IST)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Check the offline tests still pass
        run: npm run check

      - name: Build the snapshot
        env:
          API_BASE: ${{ vars.CVLAB_API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::Repository variable CVLAB_API_BASE is not set."
            echo "Settings → Secrets and variables → Actions → Variables."
            echo "Without it there is no API to snapshot."
            exit 1
          fi
          # snapshot.js retries a sleeping host for about a minute before
          # giving up, and fails the build rather than publishing a site with
          # missing photographs. A failed build leaves the live site untouched.
          npm run snapshot -- --api "${API_BASE%/}" --out dist

      - name: Report what is being published
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Snapshot taken: $(node -p "require('./dist/content.json').snapshotAt")" >> $GITHUB_STEP_SUMMARY
          echo "- Files: $(find dist -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
